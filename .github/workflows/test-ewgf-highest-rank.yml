
name: Test EWGF Highest Rank

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ewgf:
    runs-on: ubuntu-latest

    steps:
      - name: Test EWGF profile
        run: |
          python - <<'PY'
          import re
          import urllib.request
          import urllib.error

          tekken_id = "3qtdnHGhGJQQ"
          url = f"https://ewgf.gg/player/{tekken_id}"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/120.0.0.0 Safari/537.36"
              ),
              "Accept": "text/html"
          }

          request = urllib.request.Request(url, headers=headers)

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  html = response.read().decode("utf-8", errors="replace")
                  print("HTTP Status:", response.status)
                  print("Page length:", len(html))

                  ranks = re.findall(
                      r'\\"allTimeHighestRank\\":\\"([^\\"]+)\\"',
                      html
                  )

                  print("ALL TIME HIGHEST RANK:", ranks)

                  if not ranks:
                      print(
                          "Field allTimeHighestRank tidak ditemukan."
                      )

          except urllib.error.HTTPError as error:
              print("HTTP ERROR:", error.code)
              print(error.read().decode("utf-8", errors="replace")[:500])
              raise

          except Exception as error:
              print("ERROR:", str(error))
              raise
          PY
